<!--Implement the follwoing concept in single webpage
Template String
Prompt, parseInt and parseFloat-->
<!DOCTYPE html>
<html>
<head>
    <title>Variables</title>
</head>
<body>
    <script>
        //Template String
        const name = "Darshana";
        const city = "Nashik";
        const college = "SVIT ,Nashik";
        console.log(`Hello , i am ${name} from ${city}. I am studying in ${college}.`);
        
        //Prompt, parseInt 
        const num1 = parseInt(prompt("Enter first num:"));
        const num2 = parseFloat(prompt("Enter second num:"));
        const sum = num1 + num2;
        console.log(`sum of ${num1} and ${num2} is ${sum}`);

        //Prompt, parseFloat
        const num3 = parseFloat(prompt("Enter first num:"));
        const num4 = parseFloat(prompt("Enter second num:"));
        const sub = num3 - num4;
        console.log(`sub of ${num3} and ${num4} is ${sub}`);
    </script>
</body>
</html>
