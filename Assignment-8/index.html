<!DOCTYPE html>
<html>
<head>
    <title>CSS Integration Example</title>
    <!-- Document-Level / Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }
        h1 {
            color: darkblue;
        }
        .internal {
            color: green;
            font-size: 20px;
        }
    </style>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: red;">Welcome to My Webpage</h1>
    <p class="internal">
        This paragraph uses Document-Level CSS.
    </p>
    <div class="external">
        This box uses External CSS.
    </div>
    <button style="background-color: orange; color: white; padding: 10px;">
        Click Me
    </button>
</body>
</html>
