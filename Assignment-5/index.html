<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>
</head>
<body>
    <h1>Class Timetable</h1>
    <table border="1" cellpadding="10" cellspacing="0" style="border-collapse: collapse;">
        <tr>
            <th rowspan="2">Day/Time</th>
            <th colspan="2">Morning</th>
            <th rowspan="2">Lunch</th>
            <th colspan="2">Afternoon</th>
        </tr>
        <tr>
            <th>9:00-10:00</th>
            <th>10:00-11:00</th>
            <th>1:00-2:00</th>
            <th>2:00-3:00</th>
        </tr>
        <tr>
            <th>Monday</th>
            <td>OOP</td>
            <td>ML</td>
            <td>DL</td>
            <td>SPM</td>
            <td>ISR</td>
        </tr>
        <tr>
            <th>Tuesday</th>
            <td>ISR</td>
            <td>SPM</td>
            <td>DL</td>
            <td>ML</td>
            <td>OOP</td>
        </tr>
        <tr>
            <th>Wednesday</th>
            <td colspan="2">Project Work</td>
            <td>Break</td>
            <td>DL</td>
            <td>ISR</td>
        </tr>
        <tr>
            <th>Thursday</th>
            <td>SPM</td>
            <td>ML</td>
            <td>Break</td>
            <td colspan="2">Lab Session</td>
        </tr>
        <tr>
            <th>Friday</th>
            <td>Social Studies</td>
            <td>Project work</td>
            <td>Break</td>
            <td>DL</td>
            <td>Revision</td>
        </tr>
    </table>
</body>
</html>
